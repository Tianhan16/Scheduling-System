<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Zen Reflexology — Admin</title>
  <meta name="theme-color" content="#8a3033">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon-admin.png">
  <link rel="manifest" href="admin.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">Zen Reflexology<svg class="admin-seal" viewBox="0 0 24 24" role="img" aria-label="Admin view" width="20" height="20"><path fill="currentColor" fill-rule="evenodd" d="M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69l-3.61.82.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.82 1.89 3.2L12 21.04l3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/></svg></div>
    <div class="nav-row">
    <button id="prev" aria-label="Previous day">&lsaquo;</button>
    <div class="date-wrap">
      <span class="date-tap">
        <span id="dateLabel"></span>
        <input type="date" id="datePick" aria-label="Pick a date">
      </span>
      <button id="today">Today</button>
      <button id="rosterBtn" aria-label="Edit today's staff">&#9998;</button>
    </div>
    <button id="next" aria-label="Next day">&rsaquo;</button>
    </div>
  </header>
  <div id="status" hidden>Reconnecting&hellip;</div>
  <main id="board"></main>

  <dialog id="detailDialog">
    <div id="detailBody"></div>
    <div class="actions">
      <button type="button" id="dCancel" class="danger">Cancel appointment</button>
      <button type="button" id="dEdit">Edit</button>
      <button type="button" id="dClose">Close</button>
    </div>
  </dialog>

  <dialog id="addDialog">
    <form id="addForm">
      <h2 id="formTitle">New appointment</h2>
      <label>Therapist
        <select id="fTherapist"></select>
      </label>
      <label>Service
        <select id="fService"></select>
      </label>
      <div class="form-row">
        <label>Start
          <input type="time" id="fStart" step="900" required>
        </label>
        <label>Minutes
          <input type="number" id="fDuration" min="15" max="480" step="15" required>
        </label>
      </div>
      <label>Phone
        <input type="tel" id="fPhone" autocomplete="off" placeholder="empty = walk-in">
      </label>
      <label>Customer name
        <input type="text" id="fName" autocomplete="off">
      </label>
      <label>Notes
        <input type="text" id="fNotes" autocomplete="off">
      </label>
      <p id="fError" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="fCancel">Close</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="rosterDialog">
    <h2>Staff today</h2>
    <p id="rosterHint" class="hint"></p>
    <div id="rosterRows"></div>
    <div class="roster-tools">
      <button type="button" id="rAdd">+ Add column</button>
      <button type="button" id="rYesterday">Use yesterday's staff</button>
    </div>
    <p id="rError" class="error" hidden></p>
    <div class="actions">
      <button type="button" id="rClose">Close</button>
      <button type="button" id="rSave" class="primary">Save</button>
    </div>
  </dialog>

  <script>window.IS_ADMIN = true;</script>
  <script src="app.js"></script>
</body>
</html>
