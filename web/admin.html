<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Zen Reflexology — Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">Zen Reflexology</div>
    <div class="nav-row">
    <button id="prev" aria-label="Previous day">&lsaquo;</button>
    <div class="date-wrap">
      <span class="date-tap">
        <span id="dateLabel"></span>
        <input type="date" id="datePick" aria-label="Pick a date">
      </span>
      <button id="today">Today</button>
      <span class="badge">admin</span>
    </div>
    <button id="next" aria-label="Next day">&rsaquo;</button>
    </div>
  </header>
  <div id="status" hidden>Reconnecting&hellip;</div>
  <main id="board"></main>

  <dialog id="detailDialog">
    <div id="detailBody"></div>
    <div class="actions">
      <button type="button" id="dCancel" class="danger">Cancel appointment</button>
      <button type="button" id="dClose">Close</button>
    </div>
  </dialog>

  <dialog id="addDialog">
    <form id="addForm">
      <h2>New appointment</h2>
      <label>Therapist
        <select id="fTherapist"></select>
      </label>
      <label>Service
        <select id="fService"></select>
      </label>
      <div class="form-row">
        <label>Start
          <input type="time" id="fStart" step="900" required>
        </label>
        <label>Minutes
          <input type="number" id="fDuration" min="15" max="480" step="15" required>
        </label>
      </div>
      <label>Phone
        <input type="tel" id="fPhone" required autocomplete="off">
      </label>
      <label>Customer name
        <input type="text" id="fName" autocomplete="off">
      </label>
      <label>Notes
        <input type="text" id="fNotes" autocomplete="off">
      </label>
      <p id="fError" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="fCancel">Close</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script>window.IS_ADMIN = true;</script>
  <script src="app.js"></script>
</body>
</html>
