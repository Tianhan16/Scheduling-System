<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Zen Reflexology — Schedule</title>
  <meta name="theme-color" content="#8a3033">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">Zen Reflexology</div>
    <div class="nav-row">
    <button id="prev" aria-label="Previous day">&lsaquo;</button>
    <div class="date-wrap">
      <span class="date-tap">
        <span id="dateLabel"></span>
        <input type="date" id="datePick" aria-label="Pick a date">
      </span>
      <button id="today">Today</button>
    </div>
    <button id="next" aria-label="Next day">&rsaquo;</button>
    </div>
  </header>
  <div id="status" hidden>Reconnecting&hellip;</div>
  <main id="board"></main>

  <dialog id="detailDialog">
    <div id="detailBody"></div>
    <div class="actions">
      <button type="button" id="dClose">Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
