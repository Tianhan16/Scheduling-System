<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Zen Reflexology — Schedule</title>
  <meta name="theme-color" content="#8a3033">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">Zen Reflexology<svg class="holly" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M11 11 C9 5 5 3 2 4 C2 8 5 11 11 11 Z" fill="#3e8e5e"/><path d="M13 11 C15 5 19 3 22 4 C22 8 19 11 13 11 Z" fill="#4da576"/><circle cx="9" cy="14" r="2.6" fill="#d64545"/><circle cx="12.2" cy="16" r="2.6" fill="#c13a3a"/><circle cx="15.2" cy="13.8" r="2.6" fill="#d64545"/></svg></div>
    <div class="nav-row">
    <button id="prev" aria-label="Previous day">&lsaquo;</button>
    <div class="date-wrap">
      <span class="date-tap">
        <span id="dateLabel"></span>
        <input type="date" id="datePick" aria-label="Pick a date">
      </span>
      <button id="today">Today</button>
    </div>
    <button id="next" aria-label="Next day">&rsaquo;</button>
    </div>
    <div id="namesScroll"><div id="namesRow"></div></div>
    <div class="lights" aria-hidden="true"></div>
  </header>
  <div id="status" hidden>Reconnecting&hellip;</div>
  <main id="board"></main>

  <dialog id="detailDialog">
    <div id="detailBody"></div>
    <div class="actions">
      <button type="button" id="dClose">Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
